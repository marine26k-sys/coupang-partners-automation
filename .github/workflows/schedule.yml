name: 쿠팡파트너스 초안 자동화
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 실행 모드
        type: choice
        options: [demo, draft, kakao]
        default: demo
  schedule:
    - cron: '0 0,9 * * *'
permissions:
  contents: read
concurrency:
  group: partners-drafts
  cancel-in-progress: false
jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 테스트
        run: python -m unittest discover -s tests -v
      - name: 초안 생성
        env:
          RUN_MODE: ${{ inputs.mode || 'kakao' }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS || '주방 정리,수납 정리,생활용품' }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          case "$RUN_MODE" in
            demo) python main.py --demo ;;
            draft) python main.py --no-send ;;
            kakao) python main.py ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: partners-draft
          path: artifacts/draft.json
          retention-days: 7
