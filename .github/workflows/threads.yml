name: 살림셀렉트 Threads 자동 발행
run-name: "Threads ${{ github.event_name == 'schedule' && github.event.schedule || (inputs.recovery && format('recovery:{0}', inputs.hour) || format('manual:{0}', inputs.hour)) }}"

on:
  schedule:
    # GitHub의 정각 혼잡을 피하도록 KST 발행 시각에서 분 단위로 분산한다.
    # KST 09:13, 13:17, 16:23(가격 하락 전용), 18:29, 21:37
    - cron: '13 0 * * *'
    - cron: '17 4 * * *'
    - cron: '23 7 * * *'
    - cron: '29 9 * * *'
    - cron: '37 12 * * *'
  workflow_dispatch:
    inputs:
      hour:
        description: '한국시간 발행 슬롯 (09/13/16/18/21)'
        required: false
        default: '13'
      day:
        description: '복구 발행 날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
        default: ''
      recovery:
        description: '자동 복구 실행'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sallim-threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 운영 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/publications.sqlite3
            artifacts/threads.sqlite3
            artifacts/catalog-prices.sqlite3
          key: sallim-threads-state-${{ github.run_id }}
          restore-keys: sallim-threads-state-
      - run: pip install -r requirements.txt
      - name: 테스트
        run: python -m unittest discover -s tests -v
      - name: 상품 가격 기록 갱신
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
        run: python catalog.py
      - name: 홈페이지 가격 목록 배포
        id: pages_deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '0df18abdcbe310d55d00e5ce0be213ec' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN Secret이 없어 홈페이지 배포를 중단합니다.'
            exit 1
          fi
          test -s ../sallim-select-catalog/catalog.json
          cp ../sallim-select-catalog/catalog.json site/catalog.json
          test -s site/index.html
          test -s site/style.css
          test -s site/app.js
          test -s site/logo.png
          test -s site/_headers
          npx --yes wrangler pages deploy site \
            --project-name=sallim-select --commit-dirty=true
          python scripts/verify_pages_deployment.py
      - name: 발행 슬롯 계산
        env:
          MANUAL_HOUR: ${{ inputs.hour }}
          MANUAL_DAY: ${{ inputs.day }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            hour="$MANUAL_HOUR"
            day="${MANUAL_DAY:-$(TZ=Asia/Seoul date +%F)}"
            if ! [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "잘못된 발행 날짜: $day" >&2
              exit 1
            fi
          else
            case "$SCHEDULE_EXPR" in
              '13 0 * * *') hour='09' ;;
              '17 4 * * *') hour='13' ;;
              '23 7 * * *') hour='16' ;;
              '29 9 * * *') hour='18' ;;
              '37 12 * * *') hour='21' ;;
              *) echo "알 수 없는 예약 표현식: $SCHEDULE_EXPR" >&2; exit 1 ;;
            esac
            # GitHub may start a scheduled run late, including after midnight KST.
            # Derive the key from the cron's intended UTC occurrence, not the
            # runner's current local date, so retries remain attached to that slot.
            cron_utc_hour=$(printf '%s\n' "$SCHEDULE_EXPR" | awk '{print $2}')
            cron_utc_minute=$(printf '%s\n' "$SCHEDULE_EXPR" | awk '{print $1}')
            scheduled_utc_date=$(date -u +%F)
            now_utc_hour=$(date -u +%H)
            now_utc_minute=$(date -u +%M)
            if [ "$now_utc_hour" -lt "$cron_utc_hour" ] || \
              { [ "$now_utc_hour" = "$cron_utc_hour" ] && [ "$now_utc_minute" -lt "$cron_utc_minute" ]; }; then
              scheduled_utc_date=$(date -u -d 'yesterday' +%F)
            fi
            scheduled_utc="${scheduled_utc_date} ${cron_utc_hour}:${cron_utc_minute}:00 UTC"
            day=$(TZ=Asia/Seoul date -d "$scheduled_utc" +%F)
          fi
          suffix="$hour"
          drop=false
          if [ "$hour" = "16" ]; then
            suffix="16-drop"
            drop=true
          fi
          echo "AUTOMATION_RUN_KEY=${day}-${suffix}" >> "$GITHUB_ENV"
          echo "PRICE_DROP_ONLY=$drop" >> "$GITHUB_ENV"
      - name: Threads 발행
        id: publish
        continue-on-error: true
        env:
          AUTOMATION_ENABLED: 'true'
          THREADS_ENABLED: 'true'
          KAKAO_ENABLED: 'false'
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_EXPIRES_AT: ${{ secrets.THREADS_TOKEN_EXPIRES_AT }}
          THREADS_TOKEN_REFRESHED_AT: ${{ secrets.THREADS_TOKEN_REFRESHED_AT }}
        run: python main.py
      - name: 발행 일시 오류 안전 재시도
        id: retry
        if: steps.publish.outcome == 'failure'
        env:
          AUTOMATION_ENABLED: 'true'
          THREADS_ENABLED: 'true'
          KAKAO_ENABLED: 'false'
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_EXPIRES_AT: ${{ secrets.THREADS_TOKEN_EXPIRES_AT }}
          THREADS_TOKEN_REFRESHED_AT: ${{ secrets.THREADS_TOKEN_REFRESHED_AT }}
        run: |
          echo '같은 예약 키로 한 번 재시도합니다. 이미 게시됐거나 결과가 불확실하면 중복 방지 기록이 재게시를 막습니다.'
          python main.py
      - name: 발행 결과 최종 확인
        if: steps.publish.outcome == 'failure' && steps.retry.outcome != 'success'
        run: exit 1
      - name: 운영 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/publications.sqlite3
            artifacts/threads.sqlite3
            artifacts/catalog-prices.sqlite3
          key: sallim-threads-state-${{ github.run_id }}
      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-run-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
      - name: 홈페이지 배포 결과 보고
        if: always()
        env:
          PAGES_DEPLOY_OUTCOME: ${{ steps.pages_deploy.outcome }}
        run: |
          if [ "$PAGES_DEPLOY_OUTCOME" != "success" ]; then
            echo '홈페이지 배포 또는 공개 주소 확인에 실패했습니다.' >&2
            exit 1
          fi
