name: Threads 예약 누락 복구

on:
  # 30분마다 지난 예약 슬롯을 확인해 안전하게 복구한다.
  schedule:
    - cron: '23,53 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: sallim-threads-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 최근 누락 슬롯 확인 및 순차 복구
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow = 'threads.yml';
            const slots = [
              { hour: '09', cron: '13 0 * * *' },
              { hour: '13', cron: '17 4 * * *' },
              { hour: '16', cron: '23 7 * * *' },
              { hour: '18', cron: '29 9 * * *' },
              { hour: '21', cron: '37 12 * * *' },
            ];
            const kstDate = (value) => new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(value);
            const now = new Date();
            const today = kstDate(now);
            const yesterday = kstDate(new Date(now.getTime() - 24 * 60 * 60 * 1000));
            const auditDays = [yesterday, today];
            const slotTime = (day, hour, minute) => {
              const [year, month, date] = day.split('-').map(Number);
              return Date.UTC(year, month - 1, date, Number(hour) - 9, Number(minute));
            };
            const due = (day, hour, minute) => now.getTime() >= slotTime(day, hour, minute) + 30 * 60 * 1000;
            const scheduledDay = (run, cron) => {
              const [minute, hour] = cron.split(' ').map(Number);
              const created = new Date(run.created_at);
              const occurrence = new Date(Date.UTC(created.getUTCFullYear(), created.getUTCMonth(), created.getUTCDate(), hour, minute));
              if (created < occurrence) occurrence.setUTCDate(occurrence.getUTCDate() - 1);
              return kstDate(occurrence);
            };

            async function recentRuns() {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, per_page: 100
              });
              return data.workflow_runs;
            }

            let runs = await recentRuns();
            let dispatchesThisRun = 0;
            for (const day of auditDays) {
              for (const slot of slots) {
              const [slotMinute] = slot.cron.split(' ').map(Number);
              if (!due(day, slot.hour, slotMinute)) continue;
              const scheduled = runs.filter(run => run.event === 'schedule'
                && run.display_title.includes(slot.cron)
                && scheduledDay(run, slot.cron) === day)
                .sort((a, b) => b.created_at.localeCompare(a.created_at));
              const recoveryTitle = `recovery:${day}:${slot.hour}`;
              const recovery = runs.filter(run => run.event === 'workflow_dispatch'
                && (run.display_title.includes(recoveryTitle)
                  || (run.display_title.includes(`recovery:${slot.hour}`)
                    && new Date(run.created_at).getTime() >= slotTime(day, slot.hour, slotMinute) + 30 * 60 * 1000
                    && new Date(run.created_at).getTime() <= slotTime(day, slot.hour, slotMinute) + 36 * 60 * 60 * 1000)))
                .sort((a, b) => b.created_at.localeCompare(a.created_at));

              if (scheduled.some(run => run.status !== 'completed')) {
                core.info(`${slot.hour}시: 예약 실행이 대기/진행 중이라 기다립니다.`);
                continue;
              }
              if (scheduled.some(run => run.conclusion === 'success')) {
                core.info(`${slot.hour}시: 예약 실행 성공 기록이 있어 복구하지 않습니다.`);
                continue;
              }
              if (recovery.some(run => run.status !== 'completed')) {
                core.info(`${day} ${slot.hour}시: 복구 실행이 진행 중이라 기다립니다.`);
                continue;
              }
              if (recovery.some(run => run.conclusion === 'success')) {
                core.info(`${day} ${slot.hour}시: 복구 성공 기록이 있어 재실행하지 않습니다.`);
                continue;
              }
              if (recovery.length >= 2) {
                core.info(`${day} ${slot.hour}시: 복구 한도 2회에 도달했습니다.`);
                continue;
              }
              const latestRecovery = recovery[0];
              if (latestRecovery && Date.now() - new Date(latestRecovery.created_at).getTime() < 2 * 60 * 60 * 1000) {
                core.info(`${day} ${slot.hour}시: 직전 복구 후 2시간이 지나지 않아 기다립니다.`);
                continue;
              }
              if (dispatchesThisRun >= 4) {
                core.info('이번 감시 주기의 복구 실행은 4건으로 제한합니다. 나머지는 다음 확인 주기에 처리합니다.');
                return;
              }

              core.warning(`${day} ${slot.hour}시 슬롯에 성공 기록이 없어 복구를 시도합니다.`);
              const startedAt = new Date(Date.now() - 5000).toISOString();
              const { data: repository } = await github.rest.repos.get({ owner, repo });
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: workflow, ref: repository.default_branch,
                inputs: { hour: slot.hour, day, recovery: 'true' }
              });
              dispatchesThisRun += 1;

              const deadline = Date.now() + 20 * 60 * 1000;
              let dispatched = null;
              while (Date.now() < deadline) {
                await new Promise(resolve => setTimeout(resolve, 15000));
                runs = await recentRuns();
                dispatched = runs.filter(run => run.event === 'workflow_dispatch'
                  && run.display_title.includes(recoveryTitle)
                  && run.created_at >= startedAt)
                  .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
                if (dispatched?.status === 'completed') break;
              }
              if (!dispatched || dispatched.status !== 'completed') {
                core.setFailed(`${slot.hour}시 복구 실행의 완료 상태를 확인하지 못했습니다. 중복 방지를 위해 다음 슬롯 복구를 중단합니다.`);
                return;
              }
              if (dispatched.conclusion !== 'success') {
                core.warning(`${slot.hour}시 복구 실행도 실패했습니다: ${dispatched.html_url}`);
              } else {
                core.info(`${slot.hour}시 복구 실행 완료: ${dispatched.html_url}`);
              }
              }
            }
