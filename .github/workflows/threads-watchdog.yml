name: Threads 예약 누락 복구

on:
  # KST 23:53. 당일 예약 실행이 누락되거나 실패했을 때 슬롯별로 한 번 복구한다.
  schedule:
    - cron: '53 14 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: sallim-threads-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 당일 누락 슬롯 확인 및 순차 복구
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow = 'threads.yml';
            const slots = [
              { hour: '09', cron: '13 0 * * *' },
              { hour: '13', cron: '17 4 * * *' },
              { hour: '16', cron: '23 7 * * *' },
              { hour: '18', cron: '29 9 * * *' },
              { hour: '21', cron: '37 12 * * *' },
            ];
            const kstDate = (value) => new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(value);
            // This runs near the end of the KST day; always audit the prior
            // local calendar day, even if GitHub starts the monitor after midnight.
            const target = new Date(Date.now() - 24 * 60 * 60 * 1000);
            const day = kstDate(target);

            async function recentRuns() {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, per_page: 100
              });
              return data.workflow_runs;
            }

            let runs = await recentRuns();
            for (const slot of slots) {
              const scheduled = runs.filter(run => run.event === 'schedule'
                && run.display_title.includes(slot.cron)
                && kstDate(new Date(run.created_at)) === day)
                .sort((a, b) => b.created_at.localeCompare(a.created_at));
              const recoveryTitle = `recovery:${slot.hour}`;
              const recovery = runs.filter(run => run.event === 'workflow_dispatch'
                && run.display_title.includes(recoveryTitle)
                && kstDate(new Date(run.created_at)) === day)
                .sort((a, b) => b.created_at.localeCompare(a.created_at));

              if (scheduled.some(run => run.status !== 'completed')) {
                core.info(`${slot.hour}시: 예약 실행이 대기/진행 중이라 기다립니다.`);
                continue;
              }
              if (scheduled.some(run => run.conclusion === 'success')) {
                core.info(`${slot.hour}시: 예약 실행 성공 기록이 있어 복구하지 않습니다.`);
                continue;
              }
              if (recovery.length) {
                core.info(`${slot.hour}시: 오늘 자동 복구 실행 기록이 있어 다시 실행하지 않습니다.`);
                continue;
              }

              core.warning(`${slot.hour}시 슬롯에 성공한 예약 실행이 없어 한 번 복구합니다.`);
              const startedAt = new Date(Date.now() - 5000).toISOString();
              const { data: repository } = await github.rest.repos.get({ owner, repo });
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: workflow, ref: repository.default_branch,
                inputs: { hour: slot.hour, day, recovery: 'true' }
              });

              const deadline = Date.now() + 20 * 60 * 1000;
              let dispatched = null;
              while (Date.now() < deadline) {
                await new Promise(resolve => setTimeout(resolve, 15000));
                runs = await recentRuns();
                dispatched = runs.filter(run => run.event === 'workflow_dispatch'
                  && run.display_title.includes(recoveryTitle)
                  && run.created_at >= startedAt)
                  .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
                if (dispatched?.status === 'completed') break;
              }
              if (!dispatched || dispatched.status !== 'completed') {
                core.setFailed(`${slot.hour}시 복구 실행의 완료 상태를 확인하지 못했습니다. 중복 방지를 위해 다음 슬롯 복구를 중단합니다.`);
                return;
              }
              if (dispatched.conclusion !== 'success') {
                core.warning(`${slot.hour}시 복구 실행도 실패했습니다: ${dispatched.html_url}`);
              } else {
                core.info(`${slot.hour}시 복구 실행 완료: ${dispatched.html_url}`);
              }
            }
